<style>
:root{--bg:#eef0f2;--panel:#e3e7ec;--card:#f7f8f9;--navy:#1f2a44;--sub:#5b6577;--grey:#c3c8d0;--line:#d6dbe1;--orange:#d9731c;--osoft:#fbeee2;--teal:#2a8582;--tsoft:#e2f0ef}
@media (prefers-color-scheme:dark){:root{--bg:#232a36;--panel:#1c222c;--card:#2c3442;--navy:#e1e6ee;--sub:#a3adbd;--grey:#59626f;--line:#3a4350;--orange:#ec9550;--osoft:#3b3127;--teal:#5fb8b4;--tsoft:#24393a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--navy);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ── 목록 ── */
#list{height:100%;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.brand{font-size:22px;font-weight:800;margin:4px 0 2px}
.brand small{display:block;font-size:14px;font-weight:400;color:var(--sub);margin-top:2px}
.kinds{display:flex;background:var(--panel);border-radius:12px;padding:3px;margin-top:14px}
.seg{flex:1;font-size:15px;font-weight:600;padding:8px 0;border-radius:9px;color:var(--sub)}
.seg b{font-weight:500;color:var(--grey);margin-left:2px}
.seg.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.on b{color:var(--sub)}
.kind{font-weight:700;color:var(--navy)}
.chips{display:flex;flex-direction:column;gap:6px;padding:10px 0 12px}
.grp{display:flex;align-items:center;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.grp::-webkit-scrollbar{display:none}
.gl{flex:none;width:44px;font-size:12px;font-weight:700;color:var(--sub)}
.chip{flex:none;font-size:15px;padding:7px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--sub);white-space:nowrap}
.chip b{font-weight:600;margin-left:4px;color:var(--grey)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on b{color:#fff;opacity:.8}
.cards{display:grid;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 16px 13px;border:2px solid transparent;transition:transform .08s}
.card:active{transform:scale(.985)}
.card.cur{border-color:var(--orange)}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.new{font-size:12px;font-weight:700;color:var(--orange)}
.ttl{font-size:18px;font-weight:700;line-height:1.4;margin:3px 0 8px}
.subt{font-size:14px;color:var(--sub);margin:0 0 8px}
.pts{list-style:none;margin:0 0 10px;padding:0;font-size:15px}

.pts li span{color:var(--orange);font-weight:700;flex:none}
.tags{display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden}
.tag{flex:none;white-space:nowrap;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--tsoft);color:var(--teal);font-weight:600}
.empty{color:var(--sub);text-align:center;padding:40px 0}

.area{margin-bottom:18px}.al{font-size:14px;font-weight:700;color:var(--sub);margin:0 0 8px}

.tb{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--card);border-radius:12px;padding:14px;font-size:16px;font-weight:600;text-align:left}
.tb b{flex:none;font-size:13px;color:var(--teal);font-weight:700}
.hb:active,.tb:active,.vb:active{transform:scale(.98)}

.kinds{margin:0 0 12px}
/* ── 책자 ── */
#reader{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:5}
body.reading #reader{display:flex}
.rbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--panel)}
.back{font-size:16px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--card);flex:none}
.rtitle{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
#pg{font-size:14px;font-weight:700;color:var(--orange);flex:none;min-width:52px;text-align:right}
.prog{height:3px;background:var(--line)}
.prog div{height:100%;width:0;background:var(--orange);transition:width .2s}
#frame{flex:1;width:100%;border:0;background:var(--bg)}
.nav{display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel)}
.nb{flex:1;font-size:16px;font-weight:700;padding:11px 0;border-radius:12px;background:var(--navy);color:var(--bg)}
.nb:disabled{opacity:.3}
.nb:active{transform:scale(.97)}
#pg2{flex:none;min-width:64px;text-align:center;font-size:15px;font-weight:700;color:var(--sub)}
#pg2 b{color:var(--orange)}

/* ── 노트북: 왼쪽 목록, 오른쪽 책자 ── */
@media (min-width:900px){
  body{display:flex}
  #list{width:360px;flex:none;background:var(--panel);padding:28px 20px}
  .kinds{background:var(--bg)}
  .chips{margin:0;padding:10px 0 12px}
  .grp{margin:0;padding:0;flex-wrap:wrap;overflow:visible}
  #reader{position:relative;inset:auto;display:flex;flex:1;min-width:0}
  .back{display:none}
  .rbar{padding:12px 24px}
  .rtitle{font-size:17px}
}

  async function open(key, P){ const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.ct));
    const o = JSON.parse(new TextDecoder().decode(pt)), d = el(); d.textContent = JSON.stringify(o.letters); delete d.dataset.enc;
    document.getElementById('lockv').remove(); document.documentElement.classList.remove('locked');
    const src = document.getElementById('app-main'), s = document.createElement('script'); s.textContent = o.main; src.remove(); document.body.appendChild(s); }
  async function tryStored(P){ try { const r = localStorage.getItem(KEY); if (!r) return false; const o = JSON.parse(r); if (o.s !== P.s) return false;
      await open(await crypto.subtle.importKey('raw', b64(o.k), 'AES-GCM', true, ['decrypt']), P); return true; } catch (e) { return false; } }
  async function unlock(pw, remember){ const P = JSON.parse(el().textContent);
    let key; try { key = await derive(pw, P); await open(key, P); } catch (e) { return false; }
    if (remember) try { localStorage.setItem(KEY, JSON.stringify({s: P.s, k: u64(await crypto.subtle.exportKey('raw', key))})); } catch (e) {}
    return true; }
  window.lockForget = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
  document.addEventListener('DOMContentLoaded', async () => {
    if (!enc()) return;
    document.documentElement.classList.add('locked');
    document.body.insertAdjacentHTML('beforeend', `<div id="lockv"><form class="lk">
      <div class="lk-t">퍼포먼스 리뷰</div><div class="lk-s">비밀번호를 넣으면 이 기기 안에서 풉니다</div>
      <input id="lkpw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
      <label class="lk-r"><input id="lkrem" type="checkbox" checked> 이 기기에서 기억</label>
      <button class="lk-b" type="submit">열기</button><div class="lk-e" id="lkerr"></div></form></div>`);
    const P = JSON.parse(el().textContent);
    if (await tryStored(P)) return;
    const f = document.querySelector('#lockv form');
    f.onsubmit = async ev => { ev.preventDefault(); const b = f.querySelector('button'); b.disabled = true; b.textContent = '여는 중…';
      const ok = await unlock(document.getElementById('lkpw').value, document.getElementById('lkrem').checked);
      if (!ok) { b.disabled = false; b.textContent = '열기'; document.getElementById('lkerr').textContent = '비밀번호가 맞지 않습니다'; document.getElementById('lkpw').select(); } };
  });
})();
</script>
<script id="app-main" type="text/plain"></script>
</body></html>
